<section class="hero not-found" aria-labelledby="hero-heading">
  <div class="container hero-grid">
    <div>
      <p class="eyebrow">Error 404</p>
      <h1 id="hero-heading">This page doesn't exist</h1>
      <p class="hero-lead">The link may be old or mistyped. If you need septic service, the quickest way to reach us is by phone.</p>
      <div class="hero-ctas">
        <a class="btn btn-call" href="tel:{{TEL}}" data-track="call_click" data-loc="404">{{i:phone}} Call {{PHONE}}</a>
        <a class="btn btn-ghost" href="/">Go to the homepage</a>
      </div>
    </div>
  </div>
</section>
